[project]
name = "ha-ethereum-balance"
version = "0.3.2"
description = "Ethereum balance tracker for Home Assistant using the Etherscan API"
# homeassistant 2026.3.0 and later declare requires-python >=3.14.2, so claiming
# >=3.13 alongside the homeassistant floor below makes the dependency set
# unresolvable and silently resolves CI to a year-old homeassistant instead.
requires-python = ">=3.14.2"
license = "MIT"

dependencies = [
    "homeassistant>=2026.4.0",
]

[project.optional-dependencies]
dev = [
    "homeassistant-stubs",
    "mypy",
    "pre-commit",
    "pylint",
    "pytest",
    "pytest-asyncio",
    "pytest-homeassistant-custom-component",
    "ruff",
    "codespell",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
# Deliberately one release behind requires-python above. At py314 the formatter
# rewrites `except (TimeoutError, aiohttp.ClientError):` in config_flow.py into the
# PEP 758 unparenthesized form, which is a SyntaxError on anything older than 3.14.
# A HACS user on a slightly older Home Assistant would get an import crash rather
# than a lint warning, so the source stays in the portable form.
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "T20",
    "RUF",
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
